name: UI

# The React UI has its own gate, separate from the Go pipeline, so a
# UI-only change does not run the backend tests (and a backend-only change
# does not run this). A change touching both triggers both workflows.
on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/ui.yml"
  pull_request:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/ui.yml"

jobs:
  gate:
    # Typecheck, unit tests, colour tokens, community build, and the
    # community/edition boundary check. No Playwright: the tests are vitest.
    name: UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Gate (typecheck, tests, colours, build, boundaries)
        working-directory: ui
        run: |
          npm ci
          npm run check
