name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Matches go.mod's own toolchain directive. When these differ,
          # Go downloads the toolchain go.mod asks for on top of the one
          # setup-go installed -- once per job, every run.
          go-version: "1.26.6"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build UI (required for go:embed before tests)
        run: bash build-ui.sh

      - name: Run tests
        run: go test ./... -count=1

      - name: Verify UI build
        # Guard against embedding a stale shell: web/dist must be the fresh
        # React build, i.e. index.html referencing a hashed asset bundle.
        # The shared script checks that every asset the page references is
        # actually present, which the three inline tests this replaced did
        # not: they accepted any index.html that merely mentioned
        # "/assets/" next to a non-empty assets directory.
        run: bash scripts/check-ui-bundle.sh web/dist

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          # --skip=validate: the UI build writes web/dist, which is not
          # committed. It is gitignored now rather than tracked, so the
          # tree is no longer dirty here, but the flag stays because a
          # release is the wrong place to discover a difference of opinion
          # with goreleaser about what counts as clean.
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and upload UI artifact for enterprise builds
        run: |
          tar -czf /tmp/ui-dist.tar.gz -C web/dist .
          gh release upload ${{ github.ref_name }} /tmp/ui-dist.tar.gz#ui-dist.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
