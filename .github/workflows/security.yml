name: Security

on:
  pull_request:
    branches: [main]
    paths-ignore:
      # Keep in sync with ci.yml: prose docs skip the pipeline;
      # docs/schema/** deliberately still runs it.
      - "**.md"
      - "docs/adr/**"
      - "docs/rfcs/**"
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday

jobs:
  code-scan:
    name: Code Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Matches go.mod's own toolchain directive. When these differ,
          # Go downloads the toolchain go.mod asks for on top of the one
          # setup-go installed -- once per job, every run.
          go-version: "1.26.6"

      - name: Gosec (static analysis)
        uses: securego/gosec@master
        with:
          args: -no-fail -fmt=json -out=gosec-report.json ./...

      - name: Enforce Gosec baseline
        run: |
          # Assert the scan actually happened before trusting its verdict.
          # A comparison against a baseline treats "0 findings" as the best
          # possible result, so a gosec run that scanned nothing -- wrong
          # path, build failure, changed output format -- passes this gate
          # while inspecting no code, and merely suggests lowering the
          # baseline to 0. The license gate failed exactly that way for its
          # whole life (see scripts/check-licenses.sh); an empty scan must
          # never read as a clean scan.
          files=$(jq -r '.Stats.files // 0' gosec-report.json)
          if [ "$files" -lt 1 ]; then
            echo "::error::Gosec reported $files files scanned -- the scan inspected nothing, so its findings count is meaningless"
            exit 1
          fi
          # gosec still emits a report when packages fail to compile, with
          # the uncompiled ones simply absent from it. That is a partial
          # scan reporting a full-looking verdict.
          errs=$(jq -r '(."Golang errors" // {}) | length' gosec-report.json)
          if [ "$errs" -gt 0 ]; then
            echo "::error::Gosec hit $errs Go build error(s); the scan is partial and its findings count cannot be compared to the baseline"
            jq -r '."Golang errors"' gosec-report.json
            exit 1
          fi

          findings=$(jq '[.Issues[]] | length' gosec-report.json)
          baseline=$(jq -r '.issues' security/gosec-baseline.json)
          echo "Gosec findings: $findings (baseline: $baseline) across $files files"
          if [ "$findings" -gt "$baseline" ]; then
            echo "::error::Gosec findings increased from $baseline to $findings"
            exit 1
          fi
          if [ "$findings" -lt "$baseline" ]; then
            echo "Gosec baseline can be reduced from $baseline to $findings"
          fi

      - name: Upload Gosec report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosec-report
          path: gosec-report.json
          if-no-files-found: error

      - name: govulncheck (known vulnerabilities)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  license-compliance:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Matches go.mod's own toolchain directive. When these differ,
          # Go downloads the toolchain go.mod asks for on top of the one
          # setup-go installed -- once per job, every run.
          go-version: "1.26.6"

      # The gate's own tests run first: this job previously reported
      # "No forbidden licenses found" on every run while inspecting zero
      # dependencies (go-licenses cannot load a Go 1.24+ stdlib, exited
      # fatally, and `|| true` fed an empty file to the grep). A gate
      # that cannot be observed to fail is what produced that, so the
      # cases proving it still catches GPL/AGPL/SSPL gate the scan.
      - name: Test the license gate
        run: bash scripts/check-licenses_test.sh

      - name: Check for forbidden licenses
        run: bash scripts/check-licenses.sh | tee /tmp/licenses.txt

      - name: License summary
        if: always()
        run: |
          echo "## License Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/licenses.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "scan did not run" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
