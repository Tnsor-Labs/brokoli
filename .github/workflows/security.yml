name: Security

on:
  # Runs on push to main as well as on pull requests, because not every
  # commit that reaches main arrives through one. A GitHub advisory
  # temporary private fork merges straight to main by design, which is
  # exactly the flow used to fix an embargoed vulnerability, and main
  # carries no branch protection. Before this trigger existed, the whole
  # v0.11.10 security release ran zero security gates: the fix landed as
  # a push and the changelog PR touched only **.md, which the path
  # filters below correctly skip (#536).
  #
  # A gate here cannot block anything, since the merge has already
  # happened. What it buys is a baseline regression surfacing in minutes
  # instead of waiting up to a week for the Sunday run, and the state of
  # the tree at release time being a matter of record. Blocking is what
  # branch protection is for, and that is a separate decision.
  push:
    branches: [main]
    paths-ignore:
      # Keep in sync with ci.yml and the pull_request filter below;
      # Actions has no YAML anchors, so all three lists are maintained by
      # hand. docs/schema/** is deliberately NOT ignored. ui/** is the
      # React UI workspace: no Go, so no security scan.
      - "**.md"
      - "docs/adr/**"
      - "docs/rfcs/**"
      - "ui/**"
  pull_request:
    branches: [main]
    paths-ignore:
      # Keep in sync with ci.yml: prose docs skip the pipeline;
      # docs/schema/** deliberately still runs it. ui/** has no Go.
      - "**.md"
      - "docs/adr/**"
      - "docs/rfcs/**"
      - "ui/**"
  # Manually runnable. Needed twice already: after a merge that skipped
  # the gate, the only way to get a real verdict was to run gosec by hand
  # on a laptop and paste the numbers into a PR. A verdict nobody else
  # can reproduce is not much of a gate.
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday

jobs:
  code-scan:
    name: Code Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Matches go.mod's own toolchain directive. When these differ,
          # Go downloads the toolchain go.mod asks for on top of the one
          # setup-go installed -- once per job, every run.
          go-version: "1.26.6"

      - name: Gosec (static analysis)
        uses: securego/gosec@master
        with:
          args: -no-fail -fmt=json -out=gosec-report.json ./...

      - name: Enforce Gosec baseline
        run: |
          # Assert the scan actually happened before trusting its verdict.
          # A comparison against a baseline treats "0 findings" as the best
          # possible result, so a gosec run that scanned nothing -- wrong
          # path, build failure, changed output format -- passes this gate
          # while inspecting no code, and merely suggests lowering the
          # baseline to 0. The license gate failed exactly that way for its
          # whole life (see scripts/check-licenses.sh); an empty scan must
          # never read as a clean scan.
          files=$(jq -r '.Stats.files // 0' gosec-report.json)
          if [ "$files" -lt 1 ]; then
            echo "::error::Gosec reported $files files scanned -- the scan inspected nothing, so its findings count is meaningless"
            exit 1
          fi
          # gosec still emits a report when packages fail to compile, with
          # the uncompiled ones simply absent from it. That is a partial
          # scan reporting a full-looking verdict.
          errs=$(jq -r '(."Golang errors" // {}) | length' gosec-report.json)
          if [ "$errs" -gt 0 ]; then
            echo "::error::Gosec hit $errs Go build error(s); the scan is partial and its findings count cannot be compared to the baseline"
            jq -r '."Golang errors"' gosec-report.json
            exit 1
          fi

          findings=$(jq '[.Issues[]] | length' gosec-report.json)
          baseline=$(jq -r '.issues' security/gosec-baseline.json)
          echo "Gosec findings: $findings (baseline: $baseline) across $files files"
          if [ "$findings" -gt "$baseline" ]; then
            echo "::error::Gosec findings increased from $baseline to $findings"
            exit 1
          fi
          if [ "$findings" -lt "$baseline" ]; then
            echo "Gosec baseline can be reduced from $baseline to $findings"
          fi

      - name: Upload Gosec report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosec-report
          path: gosec-report.json
          if-no-files-found: error

      - name: Vulnerability gate self-test
        run: bash scripts/check-vulns_test.sh

      - name: Installer checksum verification tests
        # install.sh is what users pipe into a shell; these run it offline
        # against a fake release and assert it refuses every archive it
        # cannot verify, and installs nothing when it does.
        run: bash scripts/install_test.sh

      - name: govulncheck (known vulnerabilities)
        run: |
          # @latest on purpose: catching newly published advisories against
          # pinned dependencies is the point of this step, and pinning the
          # scanner would have hidden GO-2026-6452/6453 the day they landed.
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # Not a bare `govulncheck ./...`: an advisory with no upstream fix
          # would make this job permanently red, and a gate that cannot go
          # green is one that eventually gets deleted. The script keeps the
          # same verdict (fail on anything this repo calls) while allowing
          # audited, self-expiring exceptions in security/vuln-allowlist.json.
          bash scripts/check-vulns.sh

  license-compliance:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Matches go.mod's own toolchain directive. When these differ,
          # Go downloads the toolchain go.mod asks for on top of the one
          # setup-go installed -- once per job, every run.
          go-version: "1.26.6"

      # The gate's own tests run first: this job previously reported
      # "No forbidden licenses found" on every run while inspecting zero
      # dependencies (go-licenses cannot load a Go 1.24+ stdlib, exited
      # fatally, and `|| true` fed an empty file to the grep). A gate
      # that cannot be observed to fail is what produced that, so the
      # cases proving it still catches GPL/AGPL/SSPL gate the scan.
      - name: Test the license gate
        run: bash scripts/check-licenses_test.sh

      # set -o pipefail is load bearing. GitHub runs a `run:` step as
      # `bash -e {0}` -- WITHOUT pipefail -- so `check-licenses.sh | tee`
      # gave this step tee's exit code and the gate could not fail. It
      # reported success on a PR adding a dependency with no license at
      # all, while the script itself was exiting 1.
      #
      # That is the second time this gate went vacuous (see the `|| true`
      # described above), so scripts/check-licenses_test.sh now asserts
      # this step propagates a failure, and will fail if the pipe ever
      # loses its pipefail again.
      - name: Check for forbidden licenses
        run: |
          set -o pipefail
          bash scripts/check-licenses.sh | tee /tmp/licenses.txt

      - name: License summary
        if: always()
        run: |
          echo "## License Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/licenses.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "scan did not run" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
