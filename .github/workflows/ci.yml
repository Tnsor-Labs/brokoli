name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      # Prose-only changes don't need the Go pipeline. Deliberately NOT
      # ignored: docs/schema/** -- the canonical IR schema is read by
      # contract tests, so schema changes must run them. (GitHub Actions
      # doesn't support YAML anchors; keep both lists and security.yml
      # in sync by hand.)
      - "**.md"
      - "docs/adr/**"
      - "docs/rfcs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/adr/**"
      - "docs/rfcs/**"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Check formatting
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "Files not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Enforce outbound HTTP policy
        run: go run ./internal/cmd/netguardcheck ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Several tests are only meaningful against a real server: what a string
    # literal means, how a driver converts a value, whether a collation orders
    # the way Go does. They skip unless these variables are set, which meant
    # the differential tests gating streaming and pushdown correctness had
    # never run in CI at all — only on a developer's machine.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brokoli
          POSTGRES_PASSWORD: brokoli
          POSTGRES_DB: brokoli_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brokoli -d brokoli_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_USER: brokoli
          # Deliberately full of characters that mean something in a URI. The
          # DSN carries credentials verbatim (#338), and a password like this
          # is what proves it on every run rather than in a test that skips.
          MYSQL_PASSWORD: br@k:li/pw#1
          MYSQL_DATABASE: brokoli_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -prootpw"
          --health-interval 3s --health-timeout 5s --health-retries 30
      clickhouse:
        # ADR-027 phase 0. Same 25.3 LTS pin as docker-compose.test.yml;
        # the smoke test fails by name if the two ever disagree.
        image: clickhouse/clickhouse-server:25.3-alpine
        env:
          CLICKHOUSE_USER: brokoli
          CLICKHOUSE_PASSWORD: brokoli
          CLICKHOUSE_DB: brokoli_test
          # Lets the test user CREATE USER, which the hostile-credential
          # round-trip test needs. Scratch server, tmpfs data.
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 9000:9000
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping"
          --health-interval 3s --health-timeout 5s --health-retries 30
          --ulimit nofile=262144:262144

    env:
      BROKOLI_TEST_POSTGRES_URL: postgres://brokoli:brokoli@localhost:5432/brokoli_test?sslmode=disable
      BROKOLI_TEST_MYSQL_URL: mysql://brokoli:br@k:li/pw#1@tcp(localhost:3306)/brokoli_test
      # A second Postgres variable exists for the execution-attempt migration
      # test. Pointing it at the same server rather than leaving it unset is
      # the difference between that test running and silently not.
      BROKOLI_TEST_POSTGRES_EXECATTEMPT_URL: postgres://brokoli:brokoli@localhost:5432/brokoli_test?sslmode=disable
      # The credential test builds a DSN from parts rather than parsing one,
      # so it needs the fields separately.
      BROKOLI_TEST_CLICKHOUSE_URL: clickhouse://brokoli:brokoli@localhost:9000/brokoli_test
      BROKOLI_TEST_MYSQL_HOST: localhost
      BROKOLI_TEST_MYSQL_PORT: "3306"
      BROKOLI_TEST_MYSQL_USER: brokoli
      BROKOLI_TEST_MYSQL_PASSWORD: br@k:li/pw#1
      BROKOLI_TEST_MYSQL_DB: brokoli_test
      # Root, for the one test that toggles a server global (the LOAD DATA
      # fallback test flips local_infile off and back).
      BROKOLI_TEST_MYSQL_ROOT_URL: mysql://root:rootpw@tcp(localhost:3306)/brokoli_test

    steps:
      - uses: actions/checkout@v4

      # local_infile is off by default in MySQL 8, and a service container
      # cannot be given a command line the way docker-compose.test.yml gives
      # one. SET GLOBAL is dynamic and LOAD DATA LOCAL checks it at statement
      # time, so setting it here is equivalent to --local-infile=1.
      - name: Enable local_infile on the MySQL service
        run: mysql --host=127.0.0.1 --port=3306 -uroot -prootpw -e "SET GLOBAL local_infile=1"

      # The dbt node shells out to dbt-core, and its tests run the real
      # thing against the Postgres service above. Pinned, because dbt's CLI
      # and its run_results.json schema both change across minor versions --
      # an unpinned upgrade quietly changing behaviour is how #348 comes back.
      - name: Install dbt-core
        # setuptools<81 because dbt-clickhouse 1.8.9's native client
        # imports pkg_resources, which setuptools 81 removed.
        run: pip install --quiet "dbt-core==1.8.9" "dbt-postgres==1.8.2" "dbt-clickhouse==1.8.9" "setuptools<81"

      # The code-node wrapper is real Python now (ADR-029), tested as
      # Python: a wrapper edit fails here with a Python traceback before
      # it fails as a byte-diff inside a Go test.
      - name: Code-node wrapper contract tests (pytest)
        run: |
          pip install --quiet pytest
          python -m pytest pkg/codeexec/pywrapper/tests/ -q

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build UI (required for go:embed)
        working-directory: ui
        run: |
          npm ci
          npx playwright install chromium firefox
          npm run test:e2e
          npm run build

      - name: Test
        # Go's default per-package timeout is 10 minutes, and the engine
        # package measured 581s under -race on a loaded machine
        # (Tnsor-Labs/brokoli#329) -- 19 seconds of headroom. A runner
        # under load therefore panics, and the panic names whichever test
        # held the baton rather than anything at fault, which reads as
        # flakiness in an innocent test (#264 has collected some of those).
        #
        # 15m is chosen against the job's own 20m limit: a genuine hang
        # still panics with per-goroutine stacks INSIDE the job, which is
        # the diagnosable failure, rather than the job being killed from
        # outside with nothing to read. This raises the ceiling; it does
        # not lower the package's cost, which is tracked in #329.
        run: go test -v -race -timeout 15m ./...

      # ADR-029 dual-mode leg: the pool is the default; this keeps the
      # legacy spawn path green until its removal one release later.
      - name: Code-node legacy-path leg (pool off)
        run: env BROKOLI_CODE_POOL=0 go test -timeout 10m -run 'TestCodeNode|TestLazyRows|TestPipeline_LazyRows|TestPipeline_EmitZeroRows|TestPipeline_Streamed|TestInstanceWorker|TestExpansion' ./engine/

      - name: Coverage
        run: |
          go test -coverprofile=coverage.out ./...
          echo "=== Coverage ==="
          go tool cover -func=coverage.out | tail -1

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build binary
        run: |
          CGO_ENABLED=0 go build -o brokoli .
          echo "Binary size: $(du -h brokoli | cut -f1)"

      - name: Smoke test
        run: ./brokoli --help
