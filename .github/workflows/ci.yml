name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      # Prose-only changes don't need the Go pipeline. Deliberately NOT
      # ignored: docs/schema/** -- the canonical IR schema is read by
      # contract tests, so schema changes must run them. (GitHub Actions
      # doesn't support YAML anchors; keep both lists and security.yml
      # in sync by hand.)
      - "**.md"
      - "docs/adr/**"
      - "docs/rfcs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/adr/**"
      - "docs/rfcs/**"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Check formatting
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "Files not formatted:"
            gofmt -l .
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Several tests are only meaningful against a real server: what a string
    # literal means, how a driver converts a value, whether a collation orders
    # the way Go does. They skip unless these variables are set, which meant
    # the differential tests gating streaming and pushdown correctness had
    # never run in CI at all — only on a developer's machine.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brokoli
          POSTGRES_PASSWORD: brokoli
          POSTGRES_DB: brokoli_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brokoli -d brokoli_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_USER: brokoli
          MYSQL_PASSWORD: brokoli
          MYSQL_DATABASE: brokoli_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -prootpw"
          --health-interval 3s --health-timeout 5s --health-retries 30

    env:
      BROKOLI_TEST_POSTGRES_URL: postgres://brokoli:brokoli@localhost:5432/brokoli_test?sslmode=disable
      BROKOLI_TEST_MYSQL_URL: mysql://brokoli:brokoli@tcp(localhost:3306)/brokoli_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build UI (required for go:embed)
        working-directory: ui
        run: |
          npm ci
          npx playwright install chromium firefox
          npm run test:e2e
          npm run build

      - name: Test
        run: go test -v -race ./...

      - name: Coverage
        run: |
          go test -coverprofile=coverage.out ./...
          echo "=== Coverage ==="
          go tool cover -func=coverage.out | tail -1

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build binary
        run: |
          CGO_ENABLED=0 go build -o brokoli .
          echo "Binary size: $(du -h brokoli | cut -f1)"

      - name: Smoke test
        run: ./brokoli --help
