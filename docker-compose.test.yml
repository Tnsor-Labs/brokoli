# Databases the test suite talks to.
#
# Several tests are only meaningful against a real server: what a string
# literal means, how a driver converts a value, whether a collation orders the
# way Go does. Those are exactly the questions a fake would define away, so
# they skip unless the matching environment variable is set — which meant, for
# a long time, that they only ever ran on one developer's machine.
#
#   docker compose -f docker-compose.test.yml up -d
#   export BROKOLI_TEST_POSTGRES_URL='postgres://brokoli:brokoli@localhost:55532/brokoli_test?sslmode=disable'
#   export BROKOLI_TEST_MYSQL_URL='mysql://brokoli:br@k:li/pw#1@tcp(localhost:55533)/brokoli_test'
#   export BROKOLI_TEST_MYSQL_ROOT_URL='mysql://root:rootpw@tcp(localhost:55533)/brokoli_test'
#   export BROKOLI_TEST_CLICKHOUSE_URL='clickhouse://brokoli:brokoli@localhost:55534/brokoli_test'
#   export BROKOLI_TEST_SQLSERVER_URL='sqlserver://sa:Brokoli%2112345@localhost:55535?database=master&encrypt=disable'
#   export BROKOLI_TEST_S3_ENDPOINT='http://localhost:55536'
#   export BROKOLI_TEST_S3_ACCESS_KEY='brokoli-test'
#   export BROKOLI_TEST_S3_SECRET_KEY='brokoli-test-secret'
#   export BROKOLI_OUTBOUND_ALLOW_LOOPBACK='true' # MinIO is bound to localhost
#   go test ./...
#
# Ports are in an unusual range so this does not collide with a database
# someone already has running — 5543x is taken on at least one machine here,
# which is how that lesson was learned. The data is tmpfs — these are scratch
# servers, and a test that depends on state surviving a restart is a test
# that will fail mysteriously in CI.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brokoli
      POSTGRES_PASSWORD: brokoli
      POSTGRES_DB: brokoli_test
    ports:
      - "55532:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brokoli -d brokoli_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_USER: brokoli
      MYSQL_PASSWORD: br@k:li/pw#1
      MYSQL_DATABASE: brokoli_test
    ports:
      - "55533:3306"
    tmpfs:
      - /var/lib/mysql
    command:
      # local_infile is off by default in MySQL 8 and is what a bulk-load
      # path would need; enabling it here means the capability can be tested
      # rather than assumed available.
      - --local-infile=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpw"]
      interval: 3s
      timeout: 5s
      retries: 30

  clickhouse:
    # 25.3 is an LTS release, pinned per ADR-027 phase 0. The exposed port
    # is the NATIVE protocol (9000) -- clickhouse-go's decision path; the
    # HTTP port stays unexposed because the ADR defers the HTTP fallback.
    #
    # The password is deliberately plain for now: hostile-credential
    # coverage belongs to phase 1, when the URI builder that has to carry
    # it exists (the MySQL password above is hostile because #338's DSN
    # builder is what it proves).
    image: clickhouse/clickhouse-server:25.3-alpine
    environment:
      CLICKHOUSE_USER: brokoli
      CLICKHOUSE_PASSWORD: brokoli
      CLICKHOUSE_DB: brokoli_test
      # Lets the test user CREATE USER, which the hostile-credential
      # round-trip test needs. Scratch server, tmpfs data.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "55534:9000"
    tmpfs:
      - /var/lib/clickhouse
    ulimits:
      # The server refuses to start under the default container nofile
      # limit on some hosts; this is the value its own docs use.
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # /ping answers unauthenticated on the HTTP port inside the
      # container, so the check needs no credentials.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 3s
      timeout: 5s
      retries: 30

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Brokoli!12345"
      MSSQL_PID: Developer
    ports:
      - "55535:1433"
    tmpfs:
      - /var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/1433'"]
      interval: 5s
      timeout: 3s
      retries: 30

  # S3-compatible object store for the file-node and artifact-store tests.
  #
  # This was MinIO until 2026-09-25, when MinIO withdrew public access to
  # its container images: the pinned tag, every other tag, Docker Hub,
  # quay.io, ghcr.io and public.ecr.aws all answer "unauthorized" or
  # "repository does not exist" to an anonymous pull. Nothing in this repo
  # changed; the dependency did, and CI began failing in 8 seconds at the
  # pull, before a single test ran.
  #
  # SeaweedFS rather than an S3 mock deliberately: it is a real object
  # store and it ENFORCES the credentials below (an unauthenticated
  # request gets 403). A mock that ignores auth would let these tests pass
  # while the credential path went unexercised, which is the kind of
  # quietly hollow gate this repo keeps finding and removing.
  #
  # The service keeps the name, port and credentials the old one had, so
  # the workflow, the env vars and the tests are untouched.
  minio:
    image: chrislusf/seaweedfs:3.80
    command: server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    volumes:
      - ./testdata/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "55536:8333"
    tmpfs:
      - /data
    healthcheck:
      # 403 is the correct answer from an S3 endpoint to an unauthenticated
      # GET, and it is the first moment the API is actually serving, so it
      # is the readiness signal. `curl -f` would treat it as failure.
      # wget, not curl: this image is minimal and has no curl, which the
      # first version of this healthcheck discovered the slow way.
      test:
        - CMD-SHELL
        - 'wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -qE "HTTP/1.1 (200|403)"'
      # The master, volume and S3 components converge in about 35s on a
      # cold runner, so the window is wider than MinIO's single process
      # needed.
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
