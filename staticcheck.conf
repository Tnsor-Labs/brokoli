# staticcheck runs in CI (ci.yml, Lint & Format). Two checks are off until
# their own changes land:
#
# ST1005  error strings capitalised or ending in punctuation (34). Some are
#         shown to users and matched by tests, so they change deliberately,
#         not in a sweep.
# SA1029  built-in type as a context key (24, 22 of them in tests). The two
#         in production are api's workspace key, which code outside this
#         repository sets by its string value; a typed key needs an exported
#         setter first.
#
# A finding that is right but cannot be acted on gets a
# `//lint:ignore <check> <reason>` on the line above, never a blanket off.
checks = ["inherit", "-ST1005", "-SA1029"]
